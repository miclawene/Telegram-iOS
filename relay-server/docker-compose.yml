version: "3.9"

# ─── Telegram Relay — docker-compose.yml ─────────────────────────────────────
#
# Quick start:
#   cp .env.example .env          # fill in DOMAIN, AUTH_TOKEN, etc.
#   docker-compose up -d
#
# The stack includes:
#   relay   — Node.js WebSocket→TCP relay (port 3000, internal only)
#   certbot — Let's Encrypt certificate renewal
#   nginx   — TLS termination + WSS proxying (ports 80, 443)

services:

  # ── Relay server ─────────────────────────────────────────────────────────
  relay:
    build: .
    image: telegram-relay:latest
    container_name: telegram-relay
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
    expose:
      - "3000"
    networks:
      - relay-net
    # Read-only root filesystem for extra security
    read_only: true
    tmpfs:
      - /tmp
    # Limit resources: 1000 connections × ~30 KB each ≈ ~30 MB RSS
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx (TLS + reverse proxy) ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: telegram-relay-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - relay
    networks:
      - relay-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Certbot (Let's Encrypt) ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: telegram-relay-certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renew twice a day; certificates expire in 90 days
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $$!;
             done"

volumes:
  certbot-certs:
  certbot-www:

networks:
  relay-net:
    driver: bridge
