# ─── nginx.conf — Telegram Relay Proxy ───────────────────────────────────────
#
# Drop this file into /etc/nginx/sites-available/<DOMAIN> and symlink to
# sites-enabled/.  Fill in ${DOMAIN} with your actual domain.
#
# What this config does:
#   • Redirects plain HTTP → HTTPS
#   • Proxies WebSocket connections to /dc/* → Node.js relay (port 3000)
#   • For all other HTTPS traffic serves the decoy static site (via relay)
#   • Rate-limits connections to protect against abuse
#   • Hides server version headers

# ── Rate limiting zones ───────────────────────────────────────────────────────

# 10 r/s per IP for WebSocket upgrades
limit_req_zone  $binary_remote_addr  zone=ws_limit:10m  rate=10r/s;
# 100 r/s per IP for static decoy pages
limit_req_zone  $binary_remote_addr  zone=static_limit:10m  rate=100r/s;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    # ── TLS certificates (Let's Encrypt) ─────────────────────────────────────
    ssl_certificate      /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;

    # Modern TLS config
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "no-referrer"                                  always;
    server_tokens off;

    # ── WebSocket proxy to relay server ───────────────────────────────────────
    #
    # Pattern: /dc/<number>  (optionally with ?token=xxx)
    # Anything other than a WebSocket upgrade on this path is rejected.

    location ~ ^/dc/[1-5]$ {
        limit_req zone=ws_limit burst=20 nodelay;

        # Only allow WebSocket upgrades — drop plain HTTP on this path
        if ($http_upgrade != "websocket") {
            return 426 "Upgrade Required";
        }

        proxy_pass          http://127.0.0.1:3000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;

        # Disable buffering — relay needs streaming
        proxy_buffering          off;
        proxy_request_buffering  off;

        # Long timeouts: Telegram connections can be persistent
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
        proxy_connect_timeout 15s;

        # Max frame size (32 MB — Telegram can send large media via MTProto)
        proxy_max_temp_file_size 0;
    }

    # ── Internal health / metrics probe ──────────────────────────────────────
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        allow 127.0.0.1;
        deny  all;
    }

    # ── Everything else → decoy site (served by Node.js) ─────────────────────
    location / {
        limit_req zone=static_limit burst=50 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;

        proxy_read_timeout  30s;
        proxy_send_timeout  30s;
        proxy_connect_timeout 5s;
    }
}
