# docker-compose.dev.yml — LOCAL DEVELOPMENT ONLY
#
# Provides Postgres + Redis for local development.
# NOT a production deployment dependency — production runs on Railway
# managed Postgres + Redis (see apps/*/README and infrastructure docs).
#
#   pnpm dev:infra        # start
#   pnpm dev:infra:down   # stop

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: workos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workos
      POSTGRES_PASSWORD: workos
      POSTGRES_DB: workos
    ports:
      - "5432:5432"
    volumes:
      - workos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - workos-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  workos-pgdata:
  workos-redisdata:
